gatling {
  core { encoding = "utf-8" }
  http {
    ssl { useInsecureTrustManager = true }
    ahc { connectTimeout = 10000; requestTimeout = 120000 }
  }
  charting {
    indicators { lowerBound = 500; higherBound = 2000; percentile1 = 50; percentile2 = 75; percentile3 = 95; percentile4 = 99 }
  }
}
